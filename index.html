<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALVéON">
<title>ALVéON</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sheets.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="5.500" cy="12" r="1.600"/><circle cx="12" cy="12" r="1.600"/><circle cx="18.500" cy="12" r="1.600"/></g></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="f" d="M8 5.2v13.6a.6.6 0 0 0 .9.5l11-6.8a.6.6 0 0 0 0-1L8.900 4.700a.6.6 0 0 0-.9.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path class="f" d="M7 5h3.4v14H7zM13.600 5H17v14h-3.400z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path class="f" d="M5 5.500v13a.6.6 0 0 0 .9.5l9-6.500a.6.6 0 0 0 0-1l-9-6.500a.6.6 0 0 0-.9.5zM17 5h2.600v14H17z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path class="f" d="M19 5.500v13a.6.6 0 0 1-.9.5l-9-6.500a.6.6 0 0 1 0-1l9-6.500a.6.6 0 0 1 .9.5zM7 5H4.400v14H7z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.500c3.500 0 4.500 10 8.500 10H21M3 17h3.500c1.600 0 2.600-1.700 3.500-3.500M21 7h-6c-1.500 0-2.500 1-3.500 2.500M18.500 4.500L21 7l-2.500 2.500M18.500 14.500L21 17l-2.500 2.500"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9.500A2.500 2.500 0 0 1 6.500 7H20M17 4l3 3-3 3M20 13v1.500a2.500 2.500 0 0 1-2.500 2.500H4M7 20l-3-3 3-3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.500 6h.01M4.500 12h.01M4.500 18h.01"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.500 6.500l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10.500 10.500v5.500M13.500 10.500v5.500"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.500" cy="18" r="2.500"/><circle cx="16.500" cy="16" r="2.500"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.500"/><circle cx="9" cy="10" r="1.500"/><path d="M4.500 17l4.500-4.500 3 3 3-3 4.500 4.500"/></symbol>
  </defs>
</svg>

<div id="app">
  <div id="bgfx" aria-hidden="true"></div>

  <!-- Library: the tilted stack of albums -->
  <main id="lib" class="screen">
    <header class="top">
      <button class="brand" id="brand" type="button" aria-label="ALVéON"><img class="mk" src="img/logo.png" alt=""><span class="wm">LVéON</span></button>
      <button class="round" id="btn-add" type="button" aria-label="Add music"><svg class="ic"><use href="#i-plus"/></svg></button>
    </header>
    <div id="stage" aria-label="Albums"><div id="stack" role="list"></div></div>
    <div id="scroller" tabindex="0" aria-label="Scroll through albums"><div id="snaps"></div></div>
    <div id="empty" hidden>
      <img src="img/logo.png" alt="">
      <h2>Your library is empty</h2>
      <p>Add songs from your Files app. They stay on this phone and play without a connection.</p>
      <button class="pill-btn primary" id="empty-add" type="button">Add music</button>
    </div>
    <button id="cap" type="button" aria-label="Open album"><span id="cap-t"></span><span id="cap-a"></span></button>
    <div id="dots" aria-hidden="true"></div>
  </main>

  <!-- Album: track list -->
  <section id="album" class="sheet" hidden aria-label="Album">
    <div class="sheet-bg" id="al-bg"></div>
    <div class="sheet-scroll" id="al-scroll">
      <div class="sheet-top">
        <button class="round" id="al-back" type="button" aria-label="Back to albums"><svg class="ic"><use href="#i-back"/></svg></button>
        <button class="round" id="al-more" type="button" aria-label="Album options"><svg class="ic"><use href="#i-more"/></svg></button>
      </div>
      <div class="al-hero">
        <div class="al-cover" id="al-cover"></div>
        <h2 id="al-title"></h2>
        <p class="al-artist" id="al-artist"></p>
        <p class="al-meta" id="al-meta"></p>
        <div class="al-actions">
          <button class="pill-btn primary" id="al-play" type="button"><svg class="ic fill"><use href="#i-play"/></svg>Play</button>
          <button class="pill-btn" id="al-shuffle" type="button"><svg class="ic"><use href="#i-shuffle"/></svg>Shuffle</button>
        </div>
      </div>
      <ol id="al-tracks" class="tracks"></ol>
      <button class="add-row" id="al-add" type="button"><svg class="ic"><use href="#i-plus"/></svg>Add songs</button>
    </div>
  </section>

  <!-- Now playing: the turntable -->
  <section id="np" class="sheet" hidden aria-label="Now playing">
    <div class="sheet-bg" id="np-bg"></div>
    <div class="np-top">
      <button class="round" id="np-down" type="button" aria-label="Close player"><svg class="ic"><use href="#i-down"/></svg></button>
      <div class="np-ctx"><b id="np-ctx">Album</b></div>
      <button class="round" id="np-edit" type="button" aria-label="Edit song"><svg class="ic"><use href="#i-pen"/></svg></button>
    </div>
    <div class="np-stage" id="np-stage">
      <div class="np-rw" id="rw">
        <div class="np-rec" id="rec"><div class="np-lab" id="lab"><span class="t" id="lt"></span></div></div>
        <div class="np-sheen"></div>
        <button class="np-hit" id="hit" type="button" aria-label="Play or pause"></button>
      </div>
      <svg class="np-arm" id="armsvg" width="390" height="500" viewBox="0 0 390 500" aria-hidden="true">
        <defs><linearGradient id="tubeg" x1="0" x2="1"><stop offset="0" stop-color="#eceef2"/><stop offset=".5" stop-color="#8d919c"/><stop offset="1" stop-color="#5d616c"/></linearGradient></defs>
        <circle id="ring" cx="335" cy="60" r="50" fill="rgba(0,0,0,.14)" stroke="rgba(255,255,255,.25)" stroke-width="1.500"/>
        <g id="armg" transform="translate(335 60) rotate(0)">
          <rect id="cw" x="-13" y="-46" width="26" height="36" rx="5" fill="#15161b"/>
          <rect id="tube" x="-3.600" y="0" width="7.200" height="360" fill="url(#tubeg)"/>
          <rect id="headr" x="-13" y="314" width="26" height="44" rx="3.500" fill="#15161b"/>
          <rect id="sty" x="-1.400" y="357" width="2.800" height="9" fill="#0a0a0c"/>
          <rect id="grab" x="-24" y="-46" width="48" height="410" fill="transparent"/>
        </g>
        <circle id="cap2" cx="335" cy="60" r="16" fill="#15161b"/>
      </svg>
    </div>
    <div class="np-info">
      <h2 id="np-title"></h2>
      <p id="np-artist"></p>
    </div>
    <div class="np-ctrl">
      <button class="pw" id="np-play" type="button" aria-label="Play"><span class="pill"></span><small id="np-plabel">Play</small></button>
      <div class="grp">
        <button class="pw" id="np-prev" type="button" aria-label="Previous"><span class="pill"></span><small><svg class="ic fill"><use href="#i-prev"/></svg></small></button>
        <button class="pw" id="np-next" type="button" aria-label="Next"><span class="pill"></span><small><svg class="ic fill"><use href="#i-next"/></svg></small></button>
      </div>
    </div>
  </section>

  <!-- Mini player -->
  <div id="mini" hidden>
    <button class="mini-main" id="mini-open" type="button" aria-label="Open player">
      <span class="mini-art" id="mini-art"></span>
      <span class="mini-txt"><b id="mini-t"></b><small id="mini-a"></small></span>
    </button>
    <button class="ghost" id="mini-play" type="button" aria-label="Play"><svg class="ic fill" id="mini-ico"><use href="#i-play"/></svg></button>
    <button class="ghost" id="mini-next" type="button" aria-label="Next"><svg class="ic fill"><use href="#i-next"/></svg></button>
    <i class="mini-bar" id="mini-bar"></i>
  </div>

  <!-- Sheets and dialogs -->
  <div id="veil" hidden></div>
  <div id="sheet" hidden role="dialog" aria-modal="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Opening animation -->
  <div id="splash">
    <div class="sp-veil" id="sp-veil"></div>
    <div class="sp-row" id="sp-row">
      <div class="sp-m" id="sp-m"><div class="sp-glow" id="sp-glow"></div><img id="sp-mark" src="img/logo.png" alt=""></div>
      <span id="sp-text" aria-hidden="true"><i>L</i><i>V</i><i>é</i><i>O</i><i>N</i></span>
    </div>
  </div>
</div>

<input id="file-any" class="sr" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.aiff" multiple>
<input id="file-img" class="sr" type="file" accept="image/*">
<input id="file-bak" class="sr" type="file">
<audio id="audio" preload="metadata" playsinline></audio>

<script src="js/db.js"></script>
<script src="js/tags.js"></script>
<script src="js/media.js"></script>
<script src="js/synth.js"></script>
<script src="js/store.js"></script>
<script src="js/backup.js"></script>
<script src="js/stack.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/diag.js"></script>
<script src="js/app.js"></script>
</body>
</html>
